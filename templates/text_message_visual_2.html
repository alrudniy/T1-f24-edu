<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scripted Chat Application - Scenario 2</title>
    <style>
        /* ... (same CSS as text_message_visual.html) ... */
    </style>
</head>
<body>
    <div class="chat-container" id="chatContainer">
        <!-- Pre-scripted messages will be appended here -->
    </div>

    <div class="input-container">
        <button onclick="nextMessage()">Next</button>
    </div>

    <div class="choice-container" id="choiceContainer" style="display:none;">
        <div class="choice-prompt" id="choicePrompt">What would be the best response?</div>
        <button onclick="selectChoice(0)">Choice 1</button>
        <button onclick="selectChoice(1)">Choice 2</button>
        <button onclick="selectChoice(2)">Choice 3</button>
    </div>

    <script>
        const messages = [
            { text: 'Hi there, I am interested in the apartment.', type: 'received' },
            { text: "Great! Do you have any questions?", type: 'sent' },
            { text: 'Yes, what is the pet policy?', type: 'received' },
            { choices: [
                { text: 'No pets allowed.', isCorrect: false, explanation: 'While a valid policy, it\'s better to offer alternatives.' },
                { text: 'We allow some pets with a deposit.', isCorrect: true, explanation: 'This is a good balance between allowing pets and protecting the property.' },
                { text: 'Sure, bring a whole zoo!', isCorrect: false, explanation: 'This is unprofessional and doesn\'t convey a serious policy.' }
            ],
            nextMessage: { text: 'Okay, thanks! I have a small dog, so that works for me.', type: 'received' } },
            { text: "Perfect! When would you like to view the apartment?", type : 'sent'},
            { text: "How about tomorrow afternoon?", type : 'received'},
            { text: "Sounds good. I'll send you the details.", type : 'sent'}
        ];

        // ... (same JavaScript functions as text_message_visual.html) ...
    </script>
</body>
</html>
