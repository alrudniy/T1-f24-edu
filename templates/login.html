<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Inline CSS for the background image and styling adjustments -->
    <style>
        body {
            background-image: url('{{ url_for('static', filename='images/titlebg.png') }}');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="container mt-5">
    
    <!-- Logo Section: Displays a centered logo at the top of the page -->
    <div class="text-center mb-4">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" style="width: 350px;">
    </div>

    <!-- Main content card with padding and shadow for styling -->
    <div class="card p-5 shadow-sm" style="background: rgba(255, 255, 255, 0.8);">
        
        <!-- Heading for the Login form, centered horizontally -->
        <h2 class="text-center">Login</h2>
        
        <!-- Form to collect username and password -->
        <form method="post" class="mt-3">
            <div class="mb-3">
                <input type="text" class="form-control" name="username" placeholder="Username" required>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" name="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        
        <!-- Continue without logging in button -->
        <div class="text-center mt-3">
            <a href="{{ url_for('pick_a_path') }}" class="btn btn-secondary w-100">Continue Without Logging In</a>
        </div>
        
        <!-- Link to the account creation page -->
        <p class="mt-3 text-center">
            Don't have an account? <a href="{{ url_for('create_account') }}">Create one here</a>.
        </p>
    </div>

</body>
</html>
