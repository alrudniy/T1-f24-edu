<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-image: url('{{ url_for('static', filename='images/titlebg.jpg') }}');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #fff; /* White text for the entire page */
            position: relative;
            padding-top: 50px; /* Add space for the flash message */
        }

        .card {
            background: #343a40; /* Dark gray background for the card */
            color: #fff; /* White text in the card */
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .card img {
            width: 100%; /* Make logo span the width of the card */
            height: auto; /* Maintain aspect ratio */
            display: block;
        }

        .form-control {
            background: #495057; /* Darker gray for input fields */
            color: #fff; /* White text for inputs */
            border: 1px solid #6c757d; /* Border matching the theme */
        }

        .form-control::placeholder {
            color: #d6d6d6; /* Light gray placeholder text */
        }

        .form-control:focus {
            background: #495057; /* Keep the same background on focus */
            border-color: #007bff; /* Blue border on focus */
            color: #fff; /* Ensure text remains white */
            box-shadow: none; /* Remove any default box shadow */
        }

        .btn-primary {
            background: #007bff; /* Primary button color */
            border: none;
            color: #fff; /* White text */
        }

        .btn-primary:hover {
            background: #0056b3; /* Darker blue on hover */
        }

        .btn-outline-secondary {
            color: #fff; /* White text for the secondary button */
            border-color: #fff; /* White border */
        }

        .btn-outline-secondary:hover {
            background: #6c757d; /* Light gray on hover */
            color: #fff;
        }

        /* Flash message alert */
        .alert {
            position: absolute;
            top: -100px; /* Start above the screen */
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
            padding: 15px 30px; /* Slightly larger padding for the message */
            background-color: #343a40; /* Match card color */
            color: #fff;
            font-size: 1rem;
            text-align: center;
            z-index: 9999;
            border-radius: 0 0 10px 10px;
            width: auto; /* Let the width adjust based on the text */
            min-width: 200px; /* Set a minimum width */
            opacity: 0; /* Initially hidden */
            animation: slideIn 0.5s forwards, fadeOut 1s 5s forwards; /* Slide in and fade out */
        }

        /* Animation for sliding in */
        @keyframes slideIn {
            to {
                top: 0; /* Slide to the top of the screen */
                opacity: 1; /* Fully visible after animation */
            }
        }

        /* Animation for fading out */
        @keyframes fadeOut {
            to {
                opacity: 0; /* Fade the message out */
                top: -100px; /* Slide up when fading out */
            }
        }

        .alert-success {
            background-color: #28a745; /* Green for success messages */
        }

        .alert-info {
            background-color: #17a2b8; /* Blue for info messages */
        }
    </style>
</head>
<body class="container d-flex flex-column justify-content-center align-items-center" style="height: 100vh;">
    <!-- Flash message alert -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="alert">
                {% for category, message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <!-- Main content card -->
    <div class="card w-100" style="max-width: 400px;">
        <!-- Integrated logo at the top of the card -->
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo">
        <div class="p-4">
            <h2 class="text-center mb-4">Welcome Back</h2>
            <form method="post">
                <div class="mb-3">
                    <input type="text" class="form-control" name="username" placeholder="Username" required>
                </div>
                <div class="mb-3">
                    <input type="password" class="form-control" name="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
            <div class="text-center mt-3">
                <a href="{{ url_for('pick_a_path') }}" class="btn btn-outline-secondary w-100">Continue Without Logging In</a>
            </div>
            <p class="mt-4 text-center">
                Don't have an account? <a href="{{ url_for('create_account') }}" style="color: #007bff;">Sign up now</a>.
            </p>
        </div>
    </div>

    <script>
        // Check if there is a flash message and hide it after 5 seconds
        window.addEventListener('DOMContentLoaded', (event) => {
            const alert = document.querySelector('.alert');
            if (alert) {
                // Fade out the message after 5 seconds
                setTimeout(() => {
                    alert.classList.add('fade-out'); // Apply the fade-out animation class
                }, 5000); // Wait 5 seconds before fading out the message
            }
        });
    </script>
</body>
</html>
