<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Specifies the character encoding for the HTML document -->
    <meta charset="UTF-8">
    
    <!-- Sets the viewport to make the website responsive on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Sets the title of the web page displayed in the browser tab -->
    <title>Login</title>
    
    <!-- Links to Bootstrap CSS for styling and layout support -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-image: url('{{ url_for('static', filename='images/titlebg.jpg') }}');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #fff;
            position: relative;
            padding-top: 50px;
        }

        .card {
            background: #343a40;
            color: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .card .logo-container {
            text-align: center;
            background: #343a40;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .card .logo-container img {
            width: 300px;
            filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.5));
        }

        .form-control {
            background: #495057;
            color: #fff;
            border: 1px solid #6c757d;
        }

        .form-control::placeholder {
            color: #d6d6d6;
        }

        .form-control:focus {
            background: #495057;
            border-color: #007bff;
            color: #fff;
            box-shadow: none;
        }

        .btn-primary {
            background: #007bff;
            border: none;
            color: #fff;
        }

        .btn-primary:hover {
            background: #0056b3;
        }

        .btn-outline-secondary {
            color: #fff;
            border-color: #fff;
        }

        .btn-outline-secondary:hover {
            background: #6c757d;
            color: #fff;
        }

        .alert {
            position: absolute;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
            padding: 15px 30px;
            background-color: #343a40;
            color: #fff;
            font-size: 1rem;
            text-align: center;
            z-index: 9999;
            border-radius: 0 0 10px 10px;
            width: auto;
            min-width: 200px;
            opacity: 0;
            animation: slideIn 0.5s forwards, fadeOut 1s 5s forwards;
        }

        @keyframes slideIn {
            to {
                top: 0;
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                top: -100px;
            }
        }

        .alert-success {
            background-color: #28a745;
        }

        .alert-info {
            background-color: #17a2b8;
        }
    </style>
</head>

<body class="container d-flex flex-column justify-content-center align-items-center" style="height: 100vh;">
    <!-- Flash message alert -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="alert">
                {% for category, message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <!-- Main content card -->
    <div class="card w-100" style="max-width: 400px;">
        <!-- Logo included in the card -->
        <div class="logo-container">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Family Promise Logo">
        </div>
        <div class="p-4">
            <h2 class="text-center mb-4">Welcome Back</h2>
            <form method="post">
                <div class="mb-3">
                    <input type="text" class="form-control" name="username" placeholder="Username" required>
                </div>
                <div class="mb-3">
                    <input type="password" class="form-control" name="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
            <div class="text-center mt-3">
                <a href="{{ url_for('pick_a_path') }}" class="btn btn-outline-secondary w-100">Continue Without Logging In</a>
            </div>
            <p class="mt-4 text-center">
                Don't have an account? <a href="{{ url_for('create_account') }}" style="color: #007bff;">Sign up now</a>
            </p>
            <p class="text-center">
                Forgot Password? <a href="{{ url_for('forgot_password') }}" style="color: #007bff;">Reset here</a>
            </p>
        </div>
    </div>

    <script>
        // Check if there is a flash message and hide it after 5 seconds
        window.addEventListener('DOMContentLoaded', (event) => {
            const alert = document.querySelector('.alert');
            if (alert) {
                setTimeout(() => {
                    alert.classList.add('fade-out');
                }, 5000);
            }
        });
    </script>

</body>
</html>
