<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-image: url('{{ url_for('static', filename='images/createaccountbg.jpg') }}');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #fff;
            position: relative;
            padding-top: 50px;
        }

        .card {
            background: #343a40;
            color: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .card .logo-container {
            text-align: center;
            background: #343a40;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .card .logo-container img {
            width: 300px;
            filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.5));
        }

        .form-control {
            background: #495057;
            color: #fff;
            border: 1px solid #6c757d;
        }

        .form-control::placeholder {
            color: #d6d6d6;
        }

        .form-control:focus {
            background: #495057;
            border-color: #007bff;
            color: #fff;
            box-shadow: none;
        }

        .btn-primary {
            background: #007bff;
            border: none;
            color: #fff;
        }

        .btn-primary:hover {
            background: #0056b3;
        }

        .btn-outline-secondary {
            color: #fff;
            border-color: #fff;
        }

        .btn-outline-secondary:hover {
            background: #6c757d;
            color: #fff;
        }

        .card p {
            text-align: center;
            margin-top: 20px;
            font-size: 1rem;
            color: #fff;
        }

        .card p a {
            text-decoration: none;
            color: #007bff;
        }

        .card p a:hover {
            color: #0056b3;
        }
    </style>
</head>
<body class="container d-flex flex-column justify-content-center align-items-center" style="height: 100vh;">
    <!-- Main content card -->
    <div class="card w-100" style="max-width: 400px;">
        <!-- Logo included in the card -->
        <div class="logo-container">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo">
        </div>
        <div class="p-4">
            <h2 class="text-center mb-4">Create Your Account</h2>
            <form method="post">
                <div class="mb-3">
                    <input type="text" class="form-control" name="username" placeholder="Username" required>
                </div>
                <div class="mb-3">
                    <input type="password" class="form-control" name="password" placeholder="Password" required>
                </div>
                <div class="mb-3">
                    <input type="text" class="form-control" name="firstname" placeholder="First Name" required>
                </div>
                <div class="mb-3">
                    <input type="text" class="form-control" name="lastname" placeholder="Last Name" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Create Account</button>
            </form>
            <p class="mt-4">
                Already have an account? <a href="{{ url_for('login') }}" style="color: #007bff;">Login here</a>
            </p>
        </div>
    </div>
</body>
</html>
