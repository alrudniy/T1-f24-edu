<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pick a Path</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Background gradient */
        body {
            background: linear-gradient(to right, #3a1c71, #ffaf7b);
            color: #fff;
            font-family: Arial, sans-serif;
        }

        /* Card styling */
        .card {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            color: #ffffff;
            padding: 30px;
        }

        /* Logo styling */
        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-container img {
            width: 300px;
            filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.5));
        }

        /* Button styling */
        .btn-primary, .btn-danger {
            background-color: #ffaf7b;
            color: #3a1c71;
            border: none;
            font-size: 1.2rem;
            padding: 10px 20px;
            margin-top: 15px;
        }
        .btn-primary:hover, .btn-danger:hover {
            background-color: #ffd1b3;
        }

        /* Option links styling */
        .list-group-item {
            background-color: #fff;
            color: #3a1c71;
            font-size: 1.25rem;
            border: none;
            margin-top: 8px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .list-group-item:hover {
            background-color: #ffaf7b;
            color: #fff;
            transform: scale(1.02);
        }

        h1, h2 {
            color: #ffaf7b;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="container mt-5">
    <!-- Logo at the top -->
    <div class="logo-container">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo">
    </div>

    <!-- Main content card -->
    <div class="card shadow-lg">
        <h1 class="text-center">Welcome to the Pick a Path Page</h1>

        {% if current_user.is_authenticated %}
            <p class="text-center">Hello, {{ current_user.firstname }}! You are logged in.</p>
            <div class="text-center">
                <a href="{{ url_for('logout') }}" class="btn btn-danger">Logout</a>
            </div>
        {% else %}
            <p class="text-center">You are not logged in.</p>
            <div class="text-center">
                <a href="{{ url_for('login') }}" class="btn btn-primary">Login</a>
            </div>
        {% endif %}

        <h2 class="mt-4">Select an option below:</h2>
        <ul class="list-group list-group-flush">
            <li class="list-group-item text-center"><a href="{{ url_for('scenario1') }}" class="stretched-link">Scenario 1</a></li>
            <li class="list-group-item text-center"><a href="{{ url_for('scenario2') }}" class="stretched-link">Scenario 2</a></li>
            <li class="list-group-item text-center"><a href="{{ url_for('article1') }}" class="stretched-link">Article 1</a></li>
        </ul>
    </div>
</body>
</html>
