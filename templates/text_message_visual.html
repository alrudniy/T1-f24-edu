<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scripted Chat Application</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .chat-container {
            display: flex;
            flex-direction: column;
            max-width: 600px;
            margin: 0 auto;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 10px;
            background-color: #f9f9f9;
        }
        .message {
            padding: 10px;
            margin: 5px 0;
            border-radius: 10px;
            max-width: 75%;
        }
        .sent {
            align-self: flex-end;
            background-color: #dcf8c6;
        }
        .received {
            align-self: flex-start;
            background-color: #fff;
            border: 1px solid #ddd;
        }
        .input-container, .choice-container {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }
        .input-container button, .choice-container button {
            padding: 10px;
            border: none;
            border-radius: 10px;
            background-color: #4caf50;
            color: #fff;
            cursor: pointer;
            margin: 0 5px;
        }
        .input-container button:hover, .choice-container button:hover {
            background-color: #45a049;
        }
        .choice-prompt {
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="chat-container" id="chatContainer">
        <!-- Pre-scripted messages will be appended here -->
    </div>

    <div class="input-container">
        <button onclick="nextMessage()">Next</button>
    </div>

    <div class="choice-container" id="choiceContainer" style="display:none;">
        <div class="choice-prompt" id="choicePrompt">What would be the best response?</div>
        <button onclick="selectChoice(0)">Choice 1</button>
        <button onclick="selectChoice(1)">Choice 2</button>
        <button onclick="selectChoice(2)">Choice 3</button>
    </div>

    <script>
        const messages = [
            { text: 'Hello! How are you?', type: 'sent' },
            { text: "I'm good, thanks! How about you?", type: 'received' },
            { text: 'Doing well, thank you!', type: 'sent' },
            { text: 'Glad to hear that!', type: 'received' },
            { text: 'I have a voucher through the state voucher housing program. What accommodations could you make?', type: 'received' },
            { text: 'I can lower the price by $500 per month! Wow!', type: 'sent' },
            { choices: [
                { text: 'We can discuss lowering the rent price further.', isCorrect: false, explanation: 'This answer is too ambiguous and doesn\'t offer a concrete solution.' },
                { text: 'We can offer a payment plan.', isCorrect: false, explanation: 'This doesn\'t address the question of specific accommodations.' },
                { text: 'We accept vouchers and can offer a reduced rent of $1000 per month.', isCorrect: true, explanation: 'This provides a direct and helpful answer to the accommodation inquiry.' }
            ],
            nextMessage: { text: 'Thank you for understanding our policies.', type: 'received' } },
            // Add more pre-scripted messages and choices here
        ];

        let currentMessageIndex = 0;

        function addMessage(text, type) {
            const messageContainer = document.createElement('div');
            messageContainer.classList.add('message');
            messageContainer.classList.add(type);
            messageContainer.textContent = text;
            document.getElementById('chatContainer').appendChild(messageContainer);
        }

        function nextMessage() {
            if (currentMessageIndex < messages.length) {
                const message = messages[currentMessageIndex];

                if (message.choices) {
                    displayChoices(message.choices);
                } else {
                    addMessage(message.text, message.type);
                    currentMessageIndex++;
                    // Check for next normal message after choice
                    if (message.nextMessage) {
                        addMessage(message.nextMessage.text, message.nextMessage.type);
                        currentMessageIndex++;
                    }
                }
            }
        }

        function displayChoices(choices) {
            document.getElementById('choiceContainer').style.display = 'flex';
            document.querySelector('.input-container').style.display = 'none';
            const buttons = document.querySelectorAll('.choice-container button');
            buttons.forEach((button, index) => {
                button.textContent = choices[index].text;
                button.onclick = () => selectChoice(index);
            });
        }

        function selectChoice(index) {
            const message = messages[currentMessageIndex];
            const choice = message.choices[index];

            if (choice.isCorrect) {
                addMessage(choice.text, 'sent');
                currentMessageIndex++;
                document.getElementById('choiceContainer').style.display = 'none';
                document.querySelector('.input-container').style.display = 'flex';
                // Add next message if exists after correct choice
                if (message.nextMessage) {
                    addMessage(message.nextMessage.text, message.nextMessage.type);
                    currentMessageIndex++;
                }
                nextMessage();
            } else {
                alert('Incorrect: ' + choice.explanation);
            }
        }

        // Display the first message initially
        nextMessage();
    </script>
</body>
</html>
