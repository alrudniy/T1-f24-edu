<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('{{ url_for('static', filename='images/fpbg.jpg') }}');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #fff;
            position: relative;
            padding-top: 50px;
        }

        .card {
            background: #343a40;
            color: #fff;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .card .logo-container {
            text-align: center;
            background: #343a40;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .card .logo-container img {
            width: 300px;
            filter: drop-shadow(2px 4px 6px rgba(0, 0, 0, 0.5));
        }

        .form-control {
            background: #495057;
            color: #fff;
            border: 1px solid #6c757d;
        }

        .form-control::placeholder {
            color: #d6d6d6;
        }

        .form-control:focus {
            background: #495057;
            border-color: #007bff;
            color: #fff;
            box-shadow: none;
        }

        .btn-primary {
            background: #007bff;
            border: none;
            color: #fff;
        }

        .btn-primary:hover {
            background: #0056b3;
        }

        .alert {
            margin-top: 15px;
            background-color: #343a40;
            color: #fff;
        }

        .alert-success {
            background-color: #28a745;
        }

        .alert-info {
            background-color: #17a2b8;
        }
    </style>
</head>

<body class="container d-flex flex-column justify-content-center align-items-center" style="height: 100vh;">
    <div class="card w-100" style="max-width: 400px;">
        <!-- Optional logo -->
        <div class="logo-container">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Family Promise Logo">
        </div>
        <div class="p-4">
            <h2 class="text-center mb-4">Forgot Password</h2>

            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="post">
                <div class="mb-3">
                    <input type="email" class="form-control" name="email" placeholder="Enter your email" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Request Password Reset</button>
            </form>

            <p class="mt-4 text-center">
                Remembered your password? <a href="{{ url_for('login') }}" style="color: #007bff;">Login here</a>
            </p>
        </div>
    </div>
</body>

</html>
