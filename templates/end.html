<!DOCTYPE html>
<html>
<head>
    <title>End</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(45deg, #3a1c71, #ffaf7b);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            color: #ffaf7b;
            margin-bottom: 20px;
        }

        p {
            margin-bottom: 15px;
        }

        a, button {
            display: inline-block;
            background-color: #ffaf7b;
            color: #3a1c71;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 8px;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }

        a:hover, button:hover {
            background-color: #ffd1b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>End Page</h1>
        <p>Congratulations, you have completed the education app!</p> 
        {% if current_user.is_authenticated %}
            <a href="{{ url_for('survey') }}">Continue to Survey (Optional)</a>
        {% else %}
            <a href="{{ url_for('login') }}">Log in to take survey</a>
        {% endif %}
    </div>
</body>
</html>
